# nginx-Beispiel für das molo-Backend hinter gunicorn.
# TLS-Zertifikate z. B. mit certbot einrichten; Domain und Pfade anpassen.

upstream molo {
    server unix:/run/molo/gunicorn.sock;
}

# --- Rate-Limits (pro Client-IP) ---------------------------------------------
# Nur schreibende Anfragen zählen; GET/HEAD/OPTIONS haben einen leeren Schlüssel
# und werden nicht begrenzt.
map $request_method $molo_write_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}
# Login, Registrierung, Passwort-Reset
limit_req_zone $molo_write_key     zone=molo_auth:10m rate=10r/m;
# Lokale KI (Suche, Spracheingabe, Tag-Vorschläge)
limit_req_zone $binary_remote_addr zone=molo_ai:10m   rate=20r/m;
# Endpunkte, die E-Mails senden oder Daten anlegen (Kontakt, Meldungen, Gebiete)
limit_req_zone $molo_write_key     zone=molo_mail:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name backend.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name backend.example.org;

    ssl_certificate     /etc/letsencrypt/live/backend.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.example.org/privkey.pem;

    # Uploads: Bilder und Import-Dateien
    client_max_body_size 100M;
    proxy_read_timeout 120s;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1000;

    access_log /var/log/nginx/molo-access.log;
    error_log  /var/log/nginx/molo-error.log;

    # HSTS für Antworten des Backends (Locations mit eigenem add_header setzen es selbst)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gilt für alle Proxy-Locations unten
    proxy_request_buffering on;   # Uploads vollständig puffern (iOS sendet Chunked Encoding)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /static/ {
        alias /srv/molo/www/static/;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Hochgeladene Dateien: nie als aktive Inhalte (HTML/SVG mit Script) ausführen
    location /media/ {
        alias /srv/molo/www/media/;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Die Regeln müssen jede Schreibweise treffen, die Django annimmt: mit und
    # ohne abschließenden Slash (FlexibleSlashMiddleware) und bei Router-Routen
    # mit Formatendung wie ".json". nginx vergleicht den normalisierten Pfad
    # (dekodiert, doppelte Slashes und ./.. aufgelöst).
    # Endungen: "", "/", ".json", ".json/"
    #
    # Anmeldung, Registrierung, Passwort und Aktivierung, Push-Test (Zugangscode)
    location ~ ^/(api/v[0-9]+/(token(/(refresh|verify))?|users(/(request-password-reset|resend-activation|reset-password-with-token|change-password))?|admin/test-push)|login(/resend-activation)?|oldadmin/(login|password_change))(/|\.[a-z0-9]+/?)?$ {
        limit_req zone=molo_auth burst=10 nodelay;
        proxy_pass http://molo;
    }

    # Lokale KI: Suche, Spracheingabe, Tag-Vorschläge
    location ~ ^/api/v[0-9]+/(AI(/.*)?|(api/)?event/(ai-search|transcribe)(/|\.[a-z0-9]+/?)?)$ {
        limit_req zone=molo_ai burst=10 nodelay;
        client_max_body_size 10M;
        proxy_pass http://molo;
    }

    # Kontaktformulare, Meldungen, neue Gebiete
    location ~ ^/api/v[0-9]+/(contact/[a-z-]+|general/flag-[a-z-]+|area)(/|\.[a-z0-9]+/?)?$ {
        limit_req zone=molo_mail burst=5 nodelay;
        proxy_pass http://molo;
    }

    location / {
        proxy_pass http://molo;
    }
}
