{% load static %}
<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmelden - MOLO Redaktion</title>
    <link rel="stylesheet" href="{% static 'newadmin/css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'newadmin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'newadmin/css/components.css' %}">
    <link rel="stylesheet" href="{% static 'newadmin/css/form.css' %}">
    <script src="{% static 'newadmin/js/theme.js' %}"></script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg);
            padding: 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            width: 80px;
            height: auto;
            margin-bottom: 1rem;
        }

        .login-title {
            font-size: var(--font-size-xl);
            color: var(--color-text-primary);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .login-subtitle {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        .login-form .form-group {
            margin-bottom: 1.25rem;
        }

        .login-form label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text-secondary);
            margin-bottom: 0.375rem;
        }

        .login-form .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: var(--font-size-base);
            color: var(--input-text);
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            outline: none;
        }

        .login-form .form-input:focus {
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px var(--input-focus-shadow);
        }

        .login-form .form-input::placeholder {
            color: var(--input-placeholder);
        }

        .login-error {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            margin-bottom: 1.25rem;
            border: 1px solid rgba(231, 76, 60, 0.25);
        }

        .login-info {
            background: var(--color-surface-hover, rgba(46, 204, 113, 0.1));
            color: var(--color-text-primary);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            margin-bottom: 1.25rem;
            border: 1px solid var(--color-border);
        }

        .login-resend {
            margin-top: 0.75rem;
        }

        .login-resend button {
            width: 100%;
            padding: 0.6rem;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text-primary);
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--transition-fast), border-color var(--transition-fast);
        }

        .login-resend button:hover {
            background: var(--color-surface-hover, rgba(255,255,255,0.04));
            border-color: var(--color-accent);
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--fab-text);
            background: var(--color-accent);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--transition-fast), box-shadow var(--transition-fast);
        }

        .login-btn:hover {
            background: var(--color-accent-hover);
            box-shadow: var(--fab-shadow);
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-border);
        }

        .login-footer a {
            display: block;
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            transition: color var(--transition-fast);
        }

        .login-footer a + a {
            margin-top: 0.5rem;
        }

        .login-footer a:hover {
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <img src="{% static 'newadmin/img/molo-logo.svg' %}" alt="MOLO" class="login-logo">
                <h1 class="login-title">Redaktion</h1>
                <p class="login-subtitle">Melde dich an, um fortzufahren</p>
            </div>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            {% if info %}
            <div class="login-info">{{ info }}</div>
            {% endif %}

            <form method="post" class="login-form" action="{% url 'newadmin:login' %}">
                {% csrf_token %}
                {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}

                <div class="form-group">
                    <label for="id_username">Benutzername oder E-Mail</label>
                    <input type="text" id="id_username" name="username" class="form-input"
                           placeholder="name@beispiel.de"
                           value="{{ username|default:'' }}"
                           autocomplete="username" autofocus required>
                </div>

                <div class="form-group">
                    <label for="id_password">Passwort</label>
                    <input type="password" id="id_password" name="password" class="form-input"
                           placeholder="Passwort eingeben"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-btn">Anmelden</button>
            </form>

            {% if show_resend %}
            <form method="post" action="{% url 'newadmin:resend-activation' %}" class="login-resend">
                {% csrf_token %}
                <input type="hidden" name="username" value="{{ username|default:'' }}">
                <button type="submit">Aktivierungsmail erneut senden</button>
            </form>
            {% endif %}

            <div class="login-footer">
                <a href="/oldadmin/">Zur klassischen Ansicht</a>
                            </div>
        </div>
    </div>
</body>
</html>
